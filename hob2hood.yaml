substitutions:
  node_name: hob2hood
  friendly_name: Hob2Hood

  pin_ir: GPIO18        #Change if needed

  # Fixed-time tolerance, not the 25 % default: on a 2.9 ms mark 25 % is ±735 µs,
  # loose enough to alias distinct hob2hood codes together.
  ir_tolerance: 200us
  ir_idle: 10ms
  # Glitch threshold. Sub-threshold pulses are MERGED into their neighbours, so a
  # value too high silently corrupts frames. Ceiling is the smallest real edge.
  ir_filter: 300us
  # Must exceed api.batch_delay (100 ms) or HA never sees the ON, and stay under
  # the ~950 ms repeat interval or the repeat frames merge into one pulse.
  ir_pulse: 300ms

  # IP, not mDNS: http_request does not resolve .local names. Give the Shelly a
  # DHCP reservation. The IDs must match the virtual components provisioned there.
  shelly_host: "<Shelly IP>"
  shelly_ir_level: "200"
  shelly_ir_seq: "201"
  shelly_ir_light: "200"
  shelly_actor: "200"   # text:200, read once after a reboot (boot_sync)
  push_retry: 1s
  push_heartbeat: 30s

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  # Boot does not assume a state. Fan and light stay unknown, and are never
  # pushed, until a frame is decoded or boot_sync settles them.
  on_boot:
    priority: -100
    then:
      - lambda: 'id(decode_count_sensor).publish_state(0);'

esp32:
  variant: esp32       #Change if needed
  framework:
    type: esp-idf


logger:
  level: DEBUG          #Debug is for catching IR frames. 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  # 0s, not the 15 min default: the IR side does not need Wi-Fi, and a node that
  # reboots through an outage drops its state repeatedly for no benefit.
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

api:
  id: ha_api
  encryption:
    key: !secret api_encryption_key
  # Same reasoning as wifi.reboot_timeout. The default reboots the node every
  # 15 min whenever no API client is connected.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

# Shelly Gen3 speaks JSON-RPC over plain HTTP POST to /rpc. Short timeout: a push
# that has not landed in 3 s has already lost its race with the next IR frame.
http_request:
  id: shelly_rpc
  timeout: 3s
  watchdog_timeout: 10s
  verify_ssl: false

globals:
  # -1 = unknown: nothing decoded since boot, and boot_sync has not answered.
  # An unknown channel is never pushed, so a reboot cannot pose as `fan off`.
  - id: fan_level
    type: int
    restore_value: false
    initial_value: '-1'

  # -1 unknown, 0 off, 1 on, as fan_level.
  - id: light_state
    type: int
    restore_value: false
    initial_value: '-1'

  - id: decode_count
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last value CONFIRMED written to the Shelly. -1 = unknown, which forces a
  # push once fan_level is known, even when that is 0. Every decoded command
  # sets it back to -1: see note_fan.
  - id: pushed_level
    type: int
    restore_value: false
    initial_value: '-1'

  # What the in-flight request carries. The POST is asynchronous, so fan_level
  # can move on before the response lands.
  - id: posting_level
    type: int
    restore_value: false
    initial_value: '-1'

  - id: pushed_light
    type: int
    restore_value: false
    initial_value: '-1'

  - id: ir_seq
    type: int
    restore_value: false
    initial_value: '0'

  - id: push_fail
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: boot_synced
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: note_command
    parameters:
      cmd: string
    then:
      - lambda: |-
          id(decode_count) += 1;
          id(decode_count_sensor).publish_state(id(decode_count));
          id(command_event).trigger(cmd);

  # Every decoded command is pushed again, changed or not, and -1 in pushed_*
  # has the retry loop see it through. The Shelly's copy can be reset under us:
  # the arbiter idles it when the output is switched off from outside (HA, the
  # app), so that the hob's next word is a change it can see.
  #
  # A fan command re-sends the LIGHT as well, and that is what puts the light
  # floor back after such a reset: mid-cook, the hob's next fan command (the
  # run-on's fan 1, a manual fan off) restores 25 % and the after-run with it.
  # A light command does not re-send the fan: after a missed `fan off` that
  # would bring a stale level back.
  - id: note_fan
    parameters:
      level: int
      cmd: string
    then:
      - lambda: |-
          id(fan_level) = level;
          id(fan_level_sensor).publish_state(level);
          id(pushed_level) = -1;
          if (id(light_state) >= 0) id(pushed_light) = -1;
      - script.execute: push_level
      - if:
          condition:
            lambda: 'return id(light_state) >= 0;'
          then:
            - script.execute: push_light
      - script.execute:
          id: note_command
          cmd: !lambda 'return cmd;'

  - id: note_light
    parameters:
      lit: bool
      cmd: string
    then:
      - lambda: |-
          id(light_state) = lit ? 1 : 0;
          id(light_sensor).publish_state(lit);
          id(pushed_light) = -1;
      - script.execute: push_light
      - script.execute:
          id: note_command
          cmd: !lambda 'return cmd;'

  - id: note_push
    parameters:
      ok: bool
    then:
      - lambda: |-
          id(shelly_link_sensor).publish_state(ok);
          if (!ok) {
            id(push_fail) += 1;
            id(push_fail_sensor).publish_state(id(push_fail));
          }

  # mode: single, not restart: an in-flight POST cannot be cancelled and a second
  # request would race the first. Dropping the overlap costs nothing, because the
  # retry interval re-reads fan_level, so the latest value is what gets pushed.
  - id: push_level
    mode: single
    then:
      - lambda: 'id(posting_level) = id(fan_level);'
      - http_request.post:
          url: http://${shelly_host}/rpc
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            char buf[112];
            snprintf(buf, sizeof(buf),
                     "{\"id\":1,\"method\":\"Number.Set\","
                     "\"params\":{\"id\":${shelly_ir_level},\"value\":%d}}",
                     id(posting_level));
            return std::string(buf);
          # The Shelly answers HTTP 200 for JSON-RPC ERRORS too: an unprovisioned
          # number:200 comes back 200 OK with {"error":{"code":-105,...}}. Testing
          # the status code alone reports a healthy link while every push fails.
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  bool ok = response->status_code == 200 &&
                            body.find("\"error\"") == std::string::npos;
                  if (ok) id(pushed_level) = id(posting_level);
                  else ESP_LOGW("shelly", "push_level rejected: %s", body.c_str());
                  id(note_push)->execute(ok);
          on_error:
            then:
              - script.execute: {id: note_push, ok: false}

  - id: push_light
    mode: single
    then:
      - http_request.post:
          url: http://${shelly_host}/rpc
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            char buf[112];
            snprintf(buf, sizeof(buf),
                     "{\"id\":1,\"method\":\"Boolean.Set\","
                     "\"params\":{\"id\":${shelly_ir_light},\"value\":%s}}",
                     id(light_state) == 1 ? "true" : "false");
            return std::string(buf);
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  bool ok = response->status_code == 200 &&
                            body.find("\"error\"") == std::string::npos;
                  if (ok) id(pushed_light) = id(light_state);
                  else ESP_LOGW("shelly", "push_light rejected: %s", body.c_str());
                  id(note_push)->execute(ok);
          on_error:
            then:
              - script.execute: {id: note_push, ok: false}

  # Liveness only. ir_level is written on change, so an unchanged value produces
  # no RPC. ir_seq always changes; the arbiter tests only for "changed".
  # It cycles 1-99 and never sends 0. number:201 is not persisted, so 0 there
  # means "no beat since the Shelly booted", which is what boot_sync tests.
  - id: push_seq
    mode: single
    then:
      - lambda: 'id(ir_seq) = id(ir_seq) % 99 + 1;'
      - http_request.post:
          url: http://${shelly_host}/rpc
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            char buf[112];
            snprintf(buf, sizeof(buf),
                     "{\"id\":1,\"method\":\"Number.Set\","
                     "\"params\":{\"id\":${shelly_ir_seq},\"value\":%d}}",
                     id(ir_seq));
            return std::string(buf);
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  bool ok = response->status_code == 200 &&
                            body.find("\"error\"") == std::string::npos;
                  if (!ok) ESP_LOGW("shelly", "push_seq rejected: %s", body.c_str());
                  id(note_push)->execute(ok);
          on_error:
            then:
              - script.execute: {id: note_push, ok: false}

  # After our own reboot: did the Shelly ride through it, or come up with us?
  #
  # The Shelly adopts its persisted ir_level / ir_light when IT boots. After a
  # power cut that is the hob's state from before the cut, and our fan off /
  # light off is the only thing that stops it. After a reboot of this node alone
  # (OTA, crash, a pulled cable) the same push is indistinguishable from the hob
  # switching off: the hood stops mid-cook, and the light floor that carries the
  # after-run is lost with it. So ask first:
  #
  #   ir_seq still 0   no beat since the Shelly booted: its IR state was
  #                    restored, not heard. Push off.
  #   actor "stale"    the arbiter had given up on us, and the hob may have done
  #                    anything since. Push off.
  #   otherwise        it held the hob's state live up to our reboot. Take it
  #                    back and push nothing.
  #
  # "ir_seq still 0" only means something if our own heartbeat has not written
  # it yet, so the heartbeat waits for this answer. A beat landing first on a
  # Shelly that came up with us would read as heard, and adopt the state from
  # before a power cut.
  #
  # Shelly.GetComponents, NOT Shelly.GetStatus: on this firmware (2.0.0, 2.0.1)
  # GetStatus leaves every virtual component out, so each read came back
  # "no beat" and each reboot pushed off — the hood stopped mid-cook after an
  # OTA on 2026-09-23. `keys` narrows the reply to the four read here.
  #
  # A reply without ir_seq, ir_level and ir_light is not understood, and falls
  # back to pushing off. A channel decoded before the answer lands is newer
  # than either, and is left alone. What this cannot fix: a command the hob
  # sends while the node is down is lost, and the hood holds the last state it
  # heard until the hob next speaks.
  #
  # Only ever at boot. Afterwards the Shelly's copy is not read back, on
  # purpose: when the arbiter idles it on an external off, our fan_level and
  # light_state keep the hob's last word, which is what note_fan re-sends.
  - id: boot_sync
    mode: single
    then:
      - http_request.post:
          url: http://${shelly_host}/rpc
          request_headers:
            Content-Type: application/json
          body: >-
            {"id":1,"method":"Shelly.GetComponents","params":{"dynamic_only":true,
            "include":["status"],"keys":["number:${shelly_ir_seq}",
            "number:${shelly_ir_level}","boolean:${shelly_ir_light}",
            "text:${shelly_actor}"]}}
          capture_response: true
          # ~450 bytes. Generous on purpose: a truncated reply reads as not
          # understood, and pushes off.
          max_response_buffer_size: 8kB
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("shelly", "boot_sync: HTTP %d", response->status_code);
                    id(note_push)->execute(false);
                    return;
                  }
                  // result.components: [{"key":"number:201","status":{"value":38,...}},...]
                  // Anything absent stays below zero.
                  JsonDocument doc = json::parse_json(body);
                  JsonArrayConst comps = doc["result"]["components"];
                  float seq = -1, level = -1;
                  int lit = -1;
                  bool stale = false;
                  for (JsonVariantConst c : comps) {
                    JsonVariantConst v = c["status"]["value"];
                    if (c["key"] == "number:${shelly_ir_seq}") seq = v.as<float>();
                    else if (c["key"] == "number:${shelly_ir_level}") level = v.as<float>();
                    else if (c["key"] == "boolean:${shelly_ir_light}") lit = v.as<bool>() ? 1 : 0;
                    else if (c["key"] == "text:${shelly_actor}") stale = v == "stale";
                  }
                  bool understood = seq >= 0 && level >= 0 && lit >= 0;
                  bool adopt = understood && seq >= 1 && !stale;
                  if (id(fan_level) < 0) {
                    id(fan_level) = adopt ? (int) lroundf(level) : 0;
                    if (adopt) id(pushed_level) = id(fan_level);
                    id(fan_level_sensor).publish_state(id(fan_level));
                  }
                  if (id(light_state) < 0) {
                    id(light_state) = adopt ? lit : 0;
                    if (adopt) id(pushed_light) = id(light_state);
                    id(light_sensor).publish_state(id(light_state) == 1);
                  }
                  id(boot_synced) = true;
                  id(note_push)->execute(understood);
                  // The values are logged because this line is usually gone
                  // before an API log client reconnects; serial keeps it.
                  ESP_LOGI("shelly", "boot_sync: ir_seq %.0f ir_level %.0f ir_light %d: %s",
                           seq, level, lit,
                           adopt         ? "Shelly rode through our reboot, state adopted"
                           : !understood ? "reply not understood, pushing off"
                           : stale       ? "arbiter had gone stale, pushing off"
                                         : "no beat since the Shelly booted, pushing off");
          on_error:
            then:
              - script.execute: {id: note_push, ok: false}

# Publish-only templates: no lambda, update_interval never. These are edge-driven,
# and polling them would invent a state change the hob never sent.
sensor:
  - platform: template
    name: "Fan Level"
    id: fan_level_sensor
    icon: mdi:fan
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Decodes"
    id: decode_count_sensor
    entity_category: diagnostic
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never

  # A working link is a flat line here; a retrying link is a ramp. That is the
  # difference between "the hob sent nothing" and "the fan did not move".
  - platform: template
    name: "Shelly Push Failures"
    id: push_fail_sensor
    entity_category: diagnostic
    icon: mdi:alert-circle-outline
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never

# Every decoded frame, repeats included. An event, not a text sensor: identical
# consecutive commands produce no state change and would be silently under-counted.
event:
  - platform: template
    name: "Command"
    id: command_event
    event_types:
      - fan_off
      - fan_1
      - fan_2
      - fan_3
      - fan_4
      - light_on
      - light_off

# The link's only recovery path. Nothing else re-sends a failed push, and the hob
# will not re-assert to cover for it. Unknown channels are skipped: see boot_sync.
interval:
  - interval: ${push_retry}
    then:
      - if:
          condition:
            lambda: 'return !id(boot_synced);'
          then:
            - script.execute: boot_sync
      - if:
          condition:
            lambda: 'return id(fan_level) >= 0 && id(pushed_level) != id(fan_level);'
          then:
            - script.execute: push_level
      - if:
          condition:
            lambda: 'return id(light_state) >= 0 && id(pushed_light) != id(light_state);'
          then:
            - script.execute: push_light

  # Not before boot_sync has answered: it reads ir_seq 0 as "the Shelly came up
  # with us", and a beat of ours landing first would erase that.
  - interval: ${push_heartbeat}
    then:
      - if:
          condition:
            lambda: 'return id(boot_synced);'
          then:
            - script.execute: push_seq

remote_receiver:
  id: ir_rx
  pin:
    number: ${pin_ir}
    mode:
      input: true
      pullup: true
    # `inverted:` stays OFF. The TSOP output is active-low and the ESPHome docs
    # commonly suggest inverting, but this receiver idles high, so in these dumps
    # negative = IR burst (mark) and positive = gap (space).
  dump: raw
  tolerance:
    type: time
    value: ${ir_tolerance}
  idle: ${ir_idle}
  filter: ${ir_filter}

binary_sensor:
  - platform: template
    name: "Shelly Link"
    id: shelly_link_sensor
    device_class: connectivity
    entity_category: diagnostic

  - platform: template
    name: "Light"
    id: light_sensor
    device_class: light

  # The raw arrays below were captured from this hob with this receiver, as the
  # MIDRANGE of each edge's observed range across four sessions — ESPHome's
  # matcher is a worst-case test, so the midpoint beats the median. Yours will
  # differ; capture your own with `dump: raw` and tools/parse_raw_dump.py.
  #
  # `delayed_off` is REQUIRED, not a debounce. remote_base publishes true,
  # yield(), false, so the ON lasts one scheduler yield and api.batch_delay
  # overwrites it before the batch flushes — HA would see only OFF, forever,
  # looking exactly like a receiver fault.
  - platform: remote_receiver
    name: "Fan Off"
    id: hob2hood_fan_off
    entity_category: diagnostic
    raw:
      code: [-766, 1400, -758, 1406, -2194, 1414, -770, 1381, -1533, 2092, -735, 1430, -758, 686, -758]
    filters:
      - delayed_off: ${ir_pulse}
    on_press:
      - script.execute: {id: note_fan, level: 0, cmd: 'fan_off'}

  # Ambiguous by nature: this same frame means "automatic boil detection", "the
  # operator pressed the button" and "the hob was switched off and is entering
  # run-on at speed 1". It is recorded as level 1 and nothing more.
  - platform: remote_receiver
    name: "Fan 1"
    id: hob2hood_fan_1
    entity_category: diagnostic
    raw:
      code: [-1484, 1402, -762, 1404, -2195, 1414, -762, 1416, -758, 698, -750, 1416, -734, 2155, -722]
    filters:
      - delayed_off: ${ir_pulse}
    on_press:
      - script.execute: {id: note_fan, level: 1, cmd: 'fan_1'}

  - platform: remote_receiver
    name: "Fan 2"
    id: hob2hood_fan_2
    entity_category: diagnostic
    raw:
      code: [-1472, 1416, -748, 2861, -762, 2140, -3623, 2151, -2206]
    filters:
      - delayed_off: ${ir_pulse}
    on_press:
      - script.execute: {id: note_fan, level: 2, cmd: 'fan_2'}

  - platform: remote_receiver
    name: "Fan 3"
    id: hob2hood_fan_3
    entity_category: diagnostic
    raw:
      code: [-762, 2138, -2918, 2857, -2182, 705, -739, 2148, -2194]
    filters:
      - delayed_off: ${ir_pulse}
    on_press:
      - script.execute: {id: note_fan, level: 3, cmd: 'fan_3'}

  # Reachable only by pressing the button; automatic operation never exceeds 3.
  - platform: remote_receiver
    name: "Fan 4 Boost"
    id: hob2hood_fan_4
    entity_category: diagnostic
    raw:
      code: [-1496, 2102, -1508, 632, -1470, 2138, -1473, 1414, -774, 2112, -749, 694, -1472]
    filters:
      - delayed_off: ${ir_pulse}
    on_press:
      - script.execute: {id: note_fan, level: 4, cmd: 'fan_4'}

  # Re-sent on hob activation even when the light is already on — the one
  # exception to "the hob never re-asserts". Assigning true to true is a no-op
  # here; the push is not, and after an external off it is what starts the hood.
  - platform: remote_receiver
    name: "Light On"
    id: hob2hood_light_on
    entity_category: diagnostic
    raw:
      code: [-751, 1415, -750, 694, -1470, 754, -734, 1365, -748, 695, -1470, 2862, -734, 696, -749, 716, -1446]
    filters:
      - delayed_off: ${ir_pulse}
    on_press:
      - script.execute: {id: note_light, lit: true, cmd: 'light_on'}

  # Touches the LIGHT ONLY. It fires 120 s after hob deactivation and can land
  # minutes BEFORE `fan off`. Anything that reads it as "session over" and clears
  # the fan level will cut extraction short.
  - platform: remote_receiver
    name: "Light Off"
    id: hob2hood_light_off
    entity_category: diagnostic
    raw:
      code: [-774, 1388, -766, 683, -762, 681, -748, 2138, -750, 694, -748, 1418, -746, 1419, -762, 682, -750]
    filters:
      - delayed_off: ${ir_pulse}
    on_press:
      - script.execute: {id: note_light, lit: false, cmd: 'light_off'}